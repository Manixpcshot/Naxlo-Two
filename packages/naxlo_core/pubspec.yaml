name: naxlo_core
description: >-
  Pure-Dart core for the Naxlo Two proxy client: protocol models, share-link
  parsing, Xray/sing-box config generation, subscription decoding and the
  adaptive server ranker. No Flutter dependency, so it is unit-testable in CI.
version: 0.1.0
publish_to: none
repository: https://github.com/Manixpcshot/Naxlo-Two

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
