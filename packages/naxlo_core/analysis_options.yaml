include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Formatting-only noise must not fail CI on the first runs.
    todo: ignore

linter:
  rules:
    - avoid_empty_else
    - avoid_returning_null_for_void
    - camel_case_types
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - throw_in_finally
    - unawaited_futures
    - unnecessary_this
