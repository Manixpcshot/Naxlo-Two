name: CI

# Every push and every pull request gets the same treatment: the pure-Dart core
# is analyzed and tested on the Dart VM (fast, no Flutter download), and the app
# is analyzed and widget-tested. The split is deliberate — `dart test` for the
# ranking math runs in seconds, so failures point at the layer that broke instead
# of at "the flutter job timed out".

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  flutter-version: "3.24.5"
  line-length: "110"

jobs:
  core:
    name: naxlo_core · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/naxlo_core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Formatting
        # Informational, not blocking: the formatter's opinion about a 500-line
        # widget build is worth seeing but should never be the reason a
        # behavioural fix waits a day. Flip this to a hard failure once the tree
        # has been formatted once and kept that way.
        run: |
          if ! dart format --output=none --set-exit-if-changed --line-length 110 lib test; then
            echo "::warning title=dart format::naxlo_core is not formatted; run 'dart format --line-length 110 packages/naxlo_core'"
          fi

      # Failing step logs are one click away and, more importantly, invisible in
      # a PR review. `report` turns each analyzer/test error into a check
      # annotation so the message shows up inline in the diff and in the Checks
      # API, and also copies it into the job summary.
      - name: Analyze
        run: |
          if dart analyze > analyze.log 2>&1; then
            echo "analyze clean"
          else
            sed -E 's/^/::error::/' analyze.log | head -40
            { echo '### dart analyze (naxlo_core)'; echo '```'; tail -c 20000 analyze.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Test
        run: |
          if dart test -r expanded --concurrency 4 > test.log 2>&1; then
            tail -5 test.log
          else
            grep -E "^[0-9]{2}:[0-9]{2} .*(\[E\]|Expected|Actual|failed)" test.log | head -40 | sed -E 's/^/::error::/'
            { echo '### dart test (naxlo_core)'; echo '```'; tail -c 20000 test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            tail -40 test.log
            exit 1
          fi

  app:
    name: app · analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true

      # The repo does not vendor app/{android,ios,linux,macos,windows}; `dart
      # test` for the core needs none of it, but `flutter test` compiles the
      # plugin registrant and wants a linux/ folder for target resolution.
      - name: Generate platform scaffolding
        run: bash ../scripts/bootstrap_platforms.sh linux

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          if flutter analyze > analyze.log 2>&1; then
            echo "analyze clean"
          else
            grep -E "^ +(error|warning)" analyze.log | head -60 | sed -E 's/^ +/::error::/'
            { echo '### flutter analyze (app)'; echo '```'; tail -c 20000 analyze.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            tail -60 analyze.log
            exit 1
          fi

      - name: Test
        run: |
          if flutter test -r expanded > test.log 2>&1; then
            tail -5 test.log
          else
            grep -E "(\[E\]|Expected:|Actual:|which:|The following)" test.log | head -50 | sed -E 's/^ +/::error::/'
            { echo '### flutter test (app)'; echo '```'; tail -c 20000 test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            tail -50 test.log
            exit 1
          fi

      - name: Formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed --line-length 110 lib test

  # The config builders are the one place where an invented JSON key does not
  # throw a Dart error — it silently produces a config the engine refuses to
  # load, at the user's first connect. So the configs generated by the real
  # builders are fed to the real `xray test` / `sing-box check` here.
  #
  # Advisory for now: it depends on GitHub release *assets* being reachable and
  # on upstream not renaming an archive. Once three consecutive runs are green,
  # delete `continue-on-error`.
  manifest-and-config:
    name: release manifest + config smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the release manifest
        run: |
          jq -e '
            .app == "naxlo_two"
            and (.windows.stable.version | type == "string")
            and (.linux | has("stable"))
            and (.macos | has("stable"))
          ' release > /dev/null
          echo "release manifest ok ($(jq '.filenum' release) assets listed)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true

      - name: Verify generated configs against real engines
        continue-on-error: true
        run: |
          bash scripts/fetch_engine.sh --engine both --os linux --arch amd64
          bash scripts/verify-engine-config.sh

  # The privacy promise in docs/PRIVACY.md is one careless import away from being
  # false, so CI checks it. Note what this does *not* do: it must not grep for the
  # English word "telemetry", because the app ships the sentence "No telemetry." as
  # a UI string — a guard that fires on prose is a guard that gets deleted on the
  # second week. It matches integration *shapes*: package imports, SDK init calls
  # and known analytics hosts.
  privacy-guards:
    name: no telemetry, no surprise sockets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No analytics or crash-reporting SDKs
        run: |
          status=0
          check() { # label, pattern
            if hits="$(grep -rnE "$2" app/lib packages/*/lib 2>/dev/null)"; then
              echo "::error::$1 — found:"
              echo "$hits" | head -10
              status=1
            else
              echo "ok: $1"
            fi
          }
          check "analytics/crash SDK import" "^[[:space:]]*(import|export)[[:space:]]+['\"]package:(sentry|firebase|firebase_analytics|google_mobile_ads|posthog|matomo|amplitude|mixpanel|segment|bugsnag|appcenter|new_relic)"
          check "analytics SDK call shape" "(Sentry\.init|Firebase\.initializeApp|Posthog|Mixpanel\.track|Analytics\.logEvent|Bugsnag\.start|startNewSession)"
          check "analytics or tracking host" "(sentry\.io|google-analytics\.com|googletagmanager|posthog\.com|matomo\.|analytics\.quinn|api\.amplitude\.com|device-metrics\.us)"
          check "install identifier being generated" "(installId|deviceId|machineId|analyticsId|uuid\.v4\(\)[[:space:]]*.*track)"
          exit $status

      - name: Network call sites are only the expected ones
        run: |
          found="$(grep -rlE "HttpClient\(|Socket\.connect|SecureSocket\.connect|RawSocket" app/lib packages/*/lib | sort | tr '\n' ' ')"
          for f in $found; do
            case "$f" in
              app/lib/state/probe_service.dart|app/lib/state/subscription_service.dart|app/lib/state/update_service.dart) ;;
              *) echo "::error::unexpected network call site: $f (see docs/PRIVACY.md — say which of the three it belongs to in the PR)"; exit 1 ;;
            esac
          done
          echo "network call sites ok: $found"

      - name: Process spawn sites are only the engine and the proxy
        run: |
          found="$(grep -rlE "Process\.(start|run)" app/lib packages/*/lib | sort | tr '\n' ' ')"
          for f in $found; do
            case "$f" in
              app/lib/state/engine_service.dart|app/lib/state/system_proxy.dart|app/lib/state/update_service.dart|app/lib/state/engine_locator.dart) ;;
              *) echo "::error::unexpected process spawn site: $f"; exit 1 ;;
            esac
          done
          echo "process spawn sites ok: $found"

      - name: No key material committed, manifest uses https
        run: |
          if grep -rnE "BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY" . --exclude-dir=.git >/dev/null 2>&1; then
            echo "::error::private key material committed"
            exit 1
          fi
          for p in windows macos linux android; do
            jq -e --arg p "$p" '.[$p].stable | if . == {} then true else (.link | test("^https://")) end' release > /dev/null \
              || { echo "::error::$p manifest download link is not https"; exit 1; }
          done
          echo "manifest links are https"

  # Proves each platform toolchain can at least produce a bundle, so a release
  # job does not discover six hours later that the Linux GTK deps moved.
  cross-compile:
    name: build smoke (${{ matrix.target }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            build: flutter build linux --release
          - target: apk-arm64
            os: ubuntu-latest
            build: flutter build apk --release --target-platform android-arm64 --split-per-abi
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'apk-arm64'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true

      - name: Generate platform scaffolding
        run: |
          case "${{ matrix.target }}" in
            linux-*) bash ../scripts/bootstrap_platforms.sh linux ;;
            apk-*)   bash ../scripts/bootstrap_platforms.sh android ;;
          esac

      - name: Fetch engine binaries
        run: bash ../scripts/fetch_engine.sh --engine xray

      - name: Build
        run: ${{ matrix.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.target }}
          path: |
            app/build/linux/x64/release/bundle/**
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7
