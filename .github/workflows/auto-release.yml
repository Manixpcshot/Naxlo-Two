name: Auto release

# "Release on GitHub after every update": merging to `main` is the update. This
# workflow turns the conventional-commit subjects since the last tag into a
# semver bump, commits VERSION, tags it, and lets release.yml do the building.
#
#   fix: / perf: / refactor: / docs: / test: / build: / ci:   →  patch
#   feat: / any `!` / BREAKING CHANGE:                        →  minor (or major)
#   chore(release): …                                          →  no release
#   every commit in the range says [skip-release] / [skip ci]  →  no release
#   (one marker alone does not veto a batch that contains a real change)
#
# Two guards keep this from eating itself:
#   1. The manifest commit release.yml pushes is `chore(release):` — ignored here.
#   2. Both workflows push with a `[skip ci]`-style marker or a `tags-ignore` rule
#      in ci.yml, so push → CI → push cannot cycle.
#
# If you would rather release by hand, disable this workflow (Actions → Auto
# release → Disable) and tag whenever you like; release.yml is standalone.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a bump type instead of inferring it"
        required: false
        type: choice
        default: auto
        options: [auto, patch, minor, major, none]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  bump:
    name: decide + tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip non-release commits
        id: gate
        run: |
          # "Is a release owed?" has to be answered over the whole push, not from
          # `git log -1`. Reading only the head commit is wrong in both directions on
          # a merge: GitHub's merge subject is boilerplate ("Merge pull request #2
          # from …"), so a `[skip-release]` marker on every commit underneath it is
          # invisible — that is how this repo manufactured a v0.2.1 patch release out
          # of a CI-only change — while a single marked commit in a batch that also
          # contains a `feat:` would veto a release the users do want.
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$last_tag" ]]; then range="$last_tag..HEAD"; else range="HEAD"; fi
          head_subject="$(git log -1 --pretty=%s)"
          if grep -qiE '^chore\(release\):' <<<"$head_subject"; then
            # release.yml pushes this after publishing; it must never re-trigger.
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "head is release bookkeeping ($head_subject) — nothing to do."
            exit 0
          fi
          subjects="$(git log --no-merges --pretty=%s "$range" 2>/dev/null || true)"
          if [[ -z "$subjects" ]]; then
            subjects="$head_subject"
          fi
          total=$(grep -c . <<<"$subjects")
          opted=$(grep -icE '\[skip-release\]|\[skip ci\]' <<<"$subjects" || true)
          if [[ "$opted" -ge "$total" ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "every commit in the range opted out of a release ($opted/$total) — nothing to do."
            exit 0
          fi
          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "a release is owed for $((total - opted)) of $total commits in $range"

      - name: Compute version + notes
        id: calc
        if: steps.gate.outputs.skip == 'false'
        run: |
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -n "$last_tag" ]]; then range="$last_tag..HEAD"; else range="HEAD"; fi
          subjects="$(git log --no-merges --pretty=%s "$range" 2>/dev/null || true)"
          bodies="$(git log --no-merges --pretty=%b "$range" 2>/dev/null || true)"

          forced="${{ inputs.bump }}"
          bump=patch
          if [[ -n "$forced" && "$forced" != "auto" ]]; then
            bump="$forced"
          elif grep -q 'BREAKING CHANGE' <<<"$bodies" || grep -qE '^[a-z]+(\([^)]+\))?!:' <<<"$subjects"; then
            bump=major
          elif grep -qE '^feat(\([^)]+\))?!?:' <<<"$subjects"; then
            bump=minor
          fi
          if [[ "$bump" == "none" ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "bump forced to none; no release for this push"
            exit 0
          fi

          current="$(tr -d '[:space:]' < VERSION)"
          IFS=. read -r major minor patch _ <<<"$current"
          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          next="$major.$minor.$patch"
          echo "version=$next" >>"$GITHUB_OUTPUT"
          echo "bump=$bump" >>"$GITHUB_OUTPUT"
          {
            echo "notes<<NOTES_EOF"
            if [[ -n "$subjects" ]]; then
              echo "$subjects" | sed 's/^/- /'
            else
              echo "- internal changes"
            fi
            echo "NOTES_EOF"
          } >>"$GITHUB_OUTPUT"
          echo "==> $current -> $next ($bump)"

      - name: Commit, tag, push
        if: steps.gate.outputs.skip == 'false' && steps.calc.outputs.skip != 'true' && steps.calc.outputs.version != ''

        env:
          VERSION: ${{ steps.calc.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "naxlo-release-bot"
          git config user.email "bot@naxlo.dev"
          bash scripts/set_version.sh "$VERSION"
          git add -A
          if git diff --cached --quiet; then
            echo "no version change to commit"
            exit 0
          fi
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin "HEAD:main" "v$VERSION"

      - name: Publish the release
        if: steps.calc.outputs.version != '' && steps.gate.outputs.skip == 'false' && steps.calc.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.calc.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.calc.outputs.notes }}
        run: |
          # No dispatch here any more, and no optional PAT. This step used to call
          # `gh workflow run release.yml`, which GitHub refuses for a run started by the
          # job token - the 403 that left v0.2.0 through v0.2.2 as changelogs with no
          # installers - and when no RELEASE_DISPATCH_TOKEN secret existed it wrote
          # "no installers are attached, add a token" into the release body.
          #
          # release.yml now triggers on workflow_run for this workflow: it starts when
          # this one finishes, resolves the tag pushed above as the highest one, builds
          # that tree and attaches the artifacts with --clobber. So the line below is a
          # pointer, not a status: nothing has been built at this instant, and claiming
          # either way is how release notes end up telling people to add a secret that
          # no longer does anything.
          line="Installers are building now: the Release workflow starts when this workflow finishes, builds the tree at this tag and attaches the artifacts here. Its publish job uploads whatever built and lists what did not."
          gh release create "v$VERSION" \
            --title "Naxlo Two $VERSION" \
            --notes "$(printf '%s\n\n%s\n' "${NOTES:-}" "$line")" \
            || echo "release already exists (or release.yml publish job got here first); continuing"
