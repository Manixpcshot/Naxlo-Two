name: Release

# Tag-driven artifact pipeline. Pushing `v1.2.3` (by hand or via
# auto-release.yml) builds every platform, publishes one GitHub Release with all
# of them, then rewrites the root `release` manifest so running installs can find
# the new build and verify its sha256.
#
# Design notes worth keeping in mind when editing:
#
# * Nothing is published from a red tree: `preflight` runs the same analyze+test
#   jobs as CI and every build job depends on it.
# * `VERSION` must equal the tag. That check exists because the app compares its
#   compiled-in `kNaxloVersion` against the manifest — a tag that disagrees with
#   the source produces an updater that thinks it is always out of date, which is
#   invisible until someone upgrades twice.
# * The manifest commit is written back to `main` with `[skip ci]`, and
#   auto-release.yml ignores `chore(release):` commits, so the tag → build →
#   commit → push cycle cannot loop.

on:
  push:
    tags: ["v*"]
  # A release the bot tagged used to be a changelog with nothing to download forever:
  # a tag pushed with another workflow's GITHUB_TOKEN fires no `push: tags` event
  # (GitHub drops workflow-triggering events created with that token), and
  # `workflow_dispatch` from inside a run is refused outright.
  #
  # `branches: [main]` was the first answer to that and it is quietly wrong: on a
  # merge, this workflow and auto-release.yml start at the same moment, so preflight
  # resolves the *previous* tag and every job builds that older tree — one release
  # behind, forever. That is why a fixed `sed` line and a fixed upload glob came back
  # from CI still broken: CI was right, the checkout was a commit behind it.
  #
  # `workflow_run` fires after Auto release has finished, so the highest tag is the
  # one just created, and the tag's tree is main's tree. The assets guard in preflight
  # stays, because a run that owns nothing still has to say so instead of rebuilding.
  workflow_run:
    workflows: ["Auto release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.0"
        required: true
        type: string
      include_arm:
        description: "Also build the Windows ARM64 installer (needs an ARM64 Windows runner)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Same-ref runs supersede each other. `cancel-in-progress: false` here turned one
  # unstartable job (a retired runner label) into a permanent block: the zombie run
  # held the group, so every later release run sat in `queued` with zero jobs started,
  # and nothing in the repo could clear it. Last write wins is the right policy for a
  # publish step whose uploads are `--clobber`ed and whose tree comes from the tag: a
  # superseded run loses nothing, while a blocked run loses every release after it.
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  flutter-version: "3.24.5"
  app-name: Naxlo
  project: naxlo_two

jobs:
  preflight:
    name: version + tests gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.which.outputs.tag }}
      # 'true' means this run owns no unreleased tag, so every other job is skipped
      # and a plain merge costs one fast job instead of an hour of native builds.
      skip: ${{ steps.which.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve which release this run owns
        id: which
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Three ways in, one answer: the tag this run publishes.
          #  * workflow_dispatch with tag=...  - a human republishing a release;
          #  * a `v*` tag push                 - a human `git push --tags`;
          #  * after Auto release              - the highest tag, and only if that
          #    release still has no assets (otherwise every merge rebuilds the world).
          #    The tag must come from the *bot's* run, not from before it: the trigger
          #    is what keeps this run's tree and the tag's tree the same commit.
          tag="${{ github.event.inputs.tag }}"
          if [[ -z "$tag" ]]; then
            if [[ "$GITHUB_REF_NAME" == v* ]]; then
              tag="$GITHUB_REF_NAME"
            else
              tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
              if [[ -n "$tag" ]]; then
                n="$(gh release view "$tag" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
                if [[ "$n" != "0" ]]; then
                  echo "$tag already has $n asset(s); nothing for this run to publish"
                  echo "skip=true" >>"$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
          fi
          if [[ -z "$tag" ]]; then
            echo "nothing is tagged yet, so this run has no release to own"
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "this run publishes $tag"

      - name: Check out the tag
        if: steps.which.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          # The tag's tree, never the trigger's: a merge-to-main run would otherwise
          # publish the merge commit under the previous tag's name, which is a
          # different program carrying the same version string.
          ref: ${{ steps.which.outputs.tag }}
          fetch-depth: 0

      - name: Tag and source must agree on the version
        if: steps.which.outputs.skip != 'true'
        id: ver
        run: |
          ver="${{ steps.which.outputs.tag }}"
          ver="${ver#v}"
          echo "version=$ver" >>"$GITHUB_OUTPUT"
          if [[ "$(tr -d '[:space:]' < VERSION)" != "$ver" ]]; then
            echo "::error::VERSION at ${{ steps.which.outputs.tag }} says $(cat VERSION), the tag says $ver."
            echo "    Run scripts/set_version.sh $ver and merge it first."
            exit 1
          fi
          # Either quote style, because set_version.sh writes double quotes and this
          # grep looked for single ones: preflight failed on a correct tree and no
          # platform job ever started, which is how three tags were published with no
          # installers and not one annotation to explain it.
          grep -qE "kNaxloVersion = [\"']$ver[\"']" packages/naxlo_core/lib/src/version.dart || {
            echo "::error::packages/naxlo_core/lib/src/version.dart is not at $ver"
            exit 1
          }

      # Flutter first, then the standalone dart: both prepend to PATH, and with the
      # order reversed `flutter` resolves a dart-sdk that is not its own — which fails
      # somewhere inside `flutter test` with a message about the wrong SDK version and
      # no hint that the cause is two steps above it.
      - uses: subosito/flutter-action@v2
        if: steps.which.outputs.skip != 'true'
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true
      - uses: dart-lang/setup-dart@v1
        if: steps.which.outputs.skip != 'true'

      - name: Core tests
        if: steps.which.outputs.skip != 'true'
        working-directory: packages/naxlo_core
        run: |
          if { dart pub get && dart analyze && dart test; } > core.log 2>&1; then
            tail -3 core.log
          else
            # Same rule as ci.yml: a release must never fail mute. Without the
            # capture, the only thing a failed job says is `exit code 1`.
            bash ../scripts/annotate_log.sh core.log --max 6 --ctx 14
            { echo '### release preflight: naxlo_core'; echo '```'; tail -c 20000 core.log; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            tail -40 core.log
            exit 1
          fi

      - name: App tests
        if: steps.which.outputs.skip != 'true'
        working-directory: app
        run: |
          bash ../scripts/bootstrap_platforms.sh linux
          flutter pub get
          if flutter analyze --no-fatal-infos > analyze.log 2>&1; then
            echo "analyze clean"
          else
            bash ../scripts/annotate_log.sh analyze.log --max 5 \
              --grep '(^|[^[:alnum:]_])(error|warning)([^[:alnum:]_]|$)'
            { echo '### release preflight: flutter analyze (app)'; echo '```'; tail -c 20000 analyze.log; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            tail -60 analyze.log
            exit 1
          fi
          if flutter test -r expanded > test.log 2>&1; then
            tail -5 test.log
          else
            bash ../scripts/annotate_log.sh test.log --max 6 --ctx 14
            { echo '### release preflight: flutter test (app)'; echo '```'; tail -c 20000 test.log; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            tail -50 test.log
            exit 1
          fi

  # Engine binaries come from upstream releases rather than this repo, per
  # target, and are cached so re-running a failed job is not a re-download.
  engines:
    name: engine binaries
    if: needs.preflight.outputs.skip != 'true'
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: macos
            arch: amd64
          - os: macos
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - name: Fetch
        env:
          XRAY_VERSION: ${{ vars.XRAY_VERSION }}
          SINGBOX_VERSION: ${{ vars.SINGBOX_VERSION }}
          # Only used to read public release metadata (a token-free API call from a
          # shared runner IP is routinely rate-limited to a 403).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --require-pin because this is the one build whose output ships: the
        # engine binary must be tied to something upstream published (its own
        # digest, or packaging/engine-lock.json), not just to whatever the CDN
        # answered with. CI and developer fetches stay permissive but warn.
        run: bash scripts/fetch_engine.sh --require-pin --engine both --os "${{ matrix.os }}" --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.os }}-${{ matrix.arch }}
          path: app/assets/engine/**
          retention-days: 5

  build-linux:
    if: needs.preflight.outputs.skip != 'true'
    needs: [preflight, engines]
    name: linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            pub_arch: amd64
            dbgsym: ""
          # No arm64 leg here: `subosito/flutter-action` has nothing to install,
          # because Flutter publishes no Linux arm64 SDK for the pinned 3.24.x — the
          # leg died inside the action, before a single line of ours ran. The linux/arm64
          # *engine* is still fetched (an arm64 user can drop it in by hand), and the
          # arm64 package names stay absent from the release notes and manifest rather
          # than pointing at x64 files. Restore this when the upstream SDK exists.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true

      - name: Install system deps
        run: |
          sudo apt-get update
          # `zstd` for .pkg.tar.zst (tar --zstd shells out to it), `patchelf` +
          # `desktop-file-utils` for the AppImage's linuxdeploy plugins. A missing one of
          # these fails the *packaging* step after a successful flutter build, which reads
          # like a bug in build_packages.sh rather than a missing tool on the runner.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm zstd patchelf desktop-file-utils

      - name: Unpack engine
        uses: actions/download-artifact@v4
        with:
          name: engine-linux-${{ matrix.pub_arch }}
          path: app/assets/engine

      - name: Build
        working-directory: app
        run: |
          bash ../scripts/bootstrap_platforms.sh linux
          flutter pub get
          flutter build linux --release

      - name: Package deb / rpm / pkg.tar.zst / AppImage
        working-directory: app
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          ARCH: ${{ matrix.arch }}
        # A green `flutter build linux` then a red packager reads like a broken script;
        # it is usually a missing tool (`zstd`, `patchelf`) failing in the first seconds.
        run: |
          if bash ../packaging/linux/build_packages.sh > packages.log 2>&1; then
            ls -l dist
          else
            bash ../scripts/annotate_log.sh packages.log --max 4 --ctx 14
            { echo '### linux packaging'; echo '```'; tail -c 20000 packages.log; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            tail -50 packages.log
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: naxlo-linux-${{ matrix.arch }}
          path: |
            app/dist/*.deb
            app/dist/*.rpm
            app/dist/*.pkg.tar.zst
            app/dist/*.AppImage
          if-no-files-found: error

  build-windows:
    if: needs.preflight.outputs.skip != 'true'
    needs: [preflight, engines]
    name: windows x64
    # windows-latest is Server 2025, whose image has no VS2019: flutter asked
    # CMake for `Visual Studio 16 2019`, got "could not find any instance of Visual
    # Studio" 65ms in, and the installer never existed. Pin the image with the
    # toolset this Flutter version asks for.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true

      - name: Unpack engine
        uses: actions/download-artifact@v4
        with:
          name: engine-windows-amd64
          path: app/assets/engine

      - name: Build
        working-directory: app
        shell: bash
        env:
          # CMake reads this when the caller passes no -G; if flutter does pass one,
          # its value wins and this is inert. Either way the generator names a product
          # that exists on the runner, instead of inheriting a fallback guess.
          CMAKE_GENERATOR: Visual Studio 17 2022
        run: |
          bash ../scripts/bootstrap_platforms.sh windows
          flutter pub get
          flutter build windows --release
          # Name the missing input here, because ISCC's only complaint is a bare
          # "no files found matching" for one of its two Sources.
          test -f build/windows/x64/runner/Release/naxlo_two.exe || {
            echo "::error::flutter build windows produced no bundle at build/windows/x64/runner/Release"
            find build -maxdepth 5 -name 'naxlo_two.exe' 2>/dev/null || true
            exit 1
          }
          test -f assets/engine/windows-amd64/xray/xray.exe || {
            echo "::error::the xray engine artifact was not unpacked under app/assets/engine"
            ls -R assets/engine 2>/dev/null | head -30 || true
            exit 1
          }

      - name: Explain a failed build
        if: failure()
        shell: bash
        working-directory: app
        run: |
          # A red "Build" step here is otherwise unreadable from outside the Actions UI:
          # the job log is not retrievable through the API, so all that reaches the person
          # debugging is `exit code 1`. Re-run the same commands into a file and push its
          # tail through annotate_log.sh — annotations do arrive; this is what ci.yml's
          # test steps already do for the same reason.
          set +e
          { bash ../scripts/bootstrap_platforms.sh windows; flutter pub get; flutter build windows --release; } > rerun.log 2>&1
          code=$?
          bash ../scripts/annotate_log.sh rerun.log --max 6 --ctx 20 || true
          echo "re-run exit code: $code"
          tail -40 rerun.log

      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          choco install innosetup -y --no-progress
          # OutputDir in the .iss is relative to the script, so the installer lands
          # in packaging\windows\installer\Output — checking for it there (rather
          # than trusting ISCC's exit code, which is 0 even for a missing icon) is
          # the difference between a green job and an empty release.
          # MyAppArch is not cosmetic: it chooses the [Files] source directory
          # (`build\windows\{#MyAppArch}\runner\Release`) as well as the output name,
          # so relying on the .iss default makes the job and the script agree only by
          # coincidence. And capture ISCC's output: it writes "no files found matching
          # pattern" to stdout, and a failed Windows step's own log is often not
          # retrievable at all — annotations are, which is what found the CMake bug.

      - name: Explain a failed installer
        if: failure()
        run: bash "$GITHUB_WORKSPACE/scripts/annotate_log.sh" inno.log --max 5 --ctx 12
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppArch=x64 `
            /DMyAppVersion=$env:VERSION `
            /DEngineBinary=assets\engine\windows-amd64\xray\xray.exe `
            /DSingBoxBinary=assets\engine\windows-amd64\sing-box\sing-box.exe `
            packaging\windows\naxlo-two.iss *> inno.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content inno.log -Tail 40
            exit 1
          }
          New-Item -ItemType Directory -Force -Path app\dist | Out-Null
          Copy-Item packaging\windows\installer\Output\setup-Naxlo.x64.exe app\dist\ -ErrorAction SilentlyContinue
          if (-not (Test-Path app\dist\setup-Naxlo.x64.exe)) {
            Write-Error "Inno Setup produced no installer under packaging\windows\installer\Output"
            exit 1
          }
          Get-ChildItem app\dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: naxlo-windows-x64
          # The directory, not a glob: the job reached this step with
          # `app\dist\setup-Naxlo.x64.exe` present (its own Test-Path guard is above),
          # and `app/dist/*.exe` still reported "No files were found" — a glob that
          # depends on how @actions/glob walks Windows separators has no business being
          # the last thing between a build and a release.
          # A literal file, not a glob and not a directory. Both of those reported
          # "No files were found" from a job whose own Test-Path guard had just passed,
          # on the same runner — so whatever @actions/glob does with a relative path on
          # Windows, the installer must not depend on it. The diagnostic step below is
          # here so that if this fails again, the answer arrives as an annotation
          # instead of another 40-minute round trip.

      - name: Explain a missing installer
        if: failure()
        shell: pwsh
        run: |
          $lines = @()
          $lines += "workspace=$PWD"
          foreach ($d in @("app\dist", "packaging\windows\installer\Output")) {
            if (Test-Path $d) {
              $lines += "--- $d"
              $lines += (Get-ChildItem -Recurse -File $d | ForEach-Object { "$($_.FullName) $($_.Length)B" })
            } else {
              $lines += "--- $d (absent)"
            }
          }
          $t = ($lines -join " | ") - replace "'", ""
          Write-Host "::error::missing installer artifact: $t"
          if-no-files-found: error

  # Two native builds, then `lipo` merges them: Flutter has no cross-arch flag
  # for macOS, and an arm64-only or x64-only dmg is the classic "works on my Mac"
  # bug for a universal binary claim.
  build-macos-arch:
    if: needs.preflight.outputs.skip != 'true'
    needs: [preflight, engines]
    name: macos ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `engine_arch` is the upstream spelling of the same silicon: flutter says
          # x86_64, the engine releases say amd64. Sharing one engine artifact across
          # both legs dropped an Intel core inside the Apple Silicon app, which is a
          # crash on first connect rather than a slow one.
          # Both legs run on the same arm64 image and cross-target with ARCHS:
          # `macos-13` (the only Intel image) has been retired, and a job whose runner
          # does not exist never fails — it queues forever. That held the `concurrency`
          # group open and blocked every later release run with zero jobs started,
          # which is what "pending" for twenty minutes actually meant.
          - arch: arm64
            runner: macos-14
            engine_arch: arm64
          # No x86_64 leg: there is no Intel macOS runner left to request (macos-13 is
          # retired, and a job with no possible runner queues forever), and building the
          # second slice on an arm64 host takes xcodebuild directly. One honest slice beats
          # a dmg labelled "universal" that contains one architecture.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true

      - name: Unpack engine
        uses: actions/download-artifact@v4
        with:
          name: engine-macos-${{ matrix.engine_arch }}
          path: app/assets/engine

      - name: Build
        working-directory: app
        run: |
          bash ../scripts/bootstrap_platforms.sh macos
          flutter pub get
          # The slice is chosen by Xcode, not by the host: WITHOUT ONLY_ACTIVE_ARCH=NO
          # an x86_64 request on an arm64 runner silently builds arm64 instead, and the
          # "universal" merge two steps later would lipo two identical binaries into a
          # dmg that claims to be universal.
          # `--xcode-build-parameter` is a `flutter build ios` flag: passing it to
          # `flutter build macos` is a usage error (exit 64) that kills the job before
          # anything compiles. The Intel slice needs a direct `xcodebuild -arch` call,
          # which is not verified here — so this leg builds arm64 and the pack step
          # names what a dmg actually contains.
          if flutter build macos --release > build.log 2>&1; then
            tail -3 build.log
          else
            bash ../scripts/annotate_log.sh build.log --max 4 --ctx 14
            { echo '### macos build'; echo '```'; tail -c 20000 build.log; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            tail -60 build.log
            exit 1
          fi
          mkdir -p dist
          ditto -c -k --sequesterRsrc build/macosx/Build/Products/Release/naxlo_two.app \
            "dist/naxlo_two-$ARCH.app.zip"
        env:
          ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: naxlo-macos-${{ matrix.arch }}
          path: app/dist/*.app.zip
          if-no-files-found: error

  # Universal = two native builds merged per Mach-O file, not a flag. Flutter has
  # no `--arch` for macOS, so this job does the part that actually has to be
  # correct: lipo every executable/dylib in the bundle, re-sign ad-hoc (a merged
  # binary has a broken signature the moment it is merged), then hdiutil.
  build-macos-universal:
    name: macos universal dmg
    if: needs.preflight.outputs.skip != 'true' && needs.build-macos-arch.result == 'success'
    needs: [preflight, build-macos-arch]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: "naxlo-macos-*"
          path: app/dist
          merge-multiple: true

      - name: Merge and pack
        working-directory: app
        env:
          APP_NAME: naxlo_two.app
        run: |
          set -euo pipefail
          ls -l dist
          rm -rf merge && mkdir -p merge/a merge/b
          ditto -x -k "dist/${APP_NAME%.app}-arm64.app.zip" merge/a
          if [[ ! -f "dist/${APP_NAME%.app}-x86_64.app.zip" ]]; then
            # One slice: package what exists, under a name that says so. Shipping
            # `Naxlo.macOS.universal.dmg` around an arm64-only bundle turns a label into a
            # week of issue triage; the release notes list universal as not built, which is
            # the truth. Re-signing is still required — codesign state does not survive a
            # ditto/cp round trip on a modified bundle.
            echo "::notice title=arm64 only::no x86_64 slice in this run; packing Naxlo.macOS.arm64.dmg"
            cp -a "merge/a/$APP_NAME" "merge/one"
            codesign --remove-signature "merge/one" 2>/dev/null || true
            codesign --force --deep --sign - "merge/one"
            mkdir -p dmgroot && cp -a "merge/one" "dmgroot/$APP_NAME"
            ln -s /Applications "dmgroot/Applications"
            hdiutil create -volname "Naxlo Two" -srcfolder dmgroot -ov -format UDZO \
              "dist/Naxlo.macOS.arm64.dmg"
            shasum -a 256 "dist/Naxlo.macOS.arm64.dmg"
            exit 0
          fi
          ditto -x -k "dist/${APP_NAME%.app}-x86_64.app.zip" merge/b
          # The zips were made with `ditto -c -k` on the .app itself, so the
          # archive root is the bundle; normalise both to merge/<x>/naxlo_two.app.
          for side in a b; do
            if [[ ! -d "merge/$side/$APP_NAME" && -d "merge/$side/dist/$APP_NAME" ]]; then
              mv "merge/$side/dist/$APP_NAME" "merge/$side/$APP_NAME"
            fi
          done
          cp -a "merge/a/$APP_NAME" "merge/universal"
          merged=0
          while IFS= read -r f; do
            rel="${f#merge/a/$APP_NAME/}"
            other="merge/b/$APP_NAME/$rel"
            [[ -f "$other" ]] || continue
            file "$f" | grep -qi 'Mach-O' || continue
            file "$other" | grep -qi 'Mach-O' || continue
            if lipo -info "$f" | grep -q 'Architectures in the fat file'; then
              cp "$f" "merge/universal/$rel"; continue
            fi
            lipo -create "$f" "$other" -output "merge/universal/$rel" && merged=$((merged + 1))
          done < <(find "merge/a/$APP_NAME" -type f)
          echo "lipot $merged file(s) into the bundle"
          lipo -info "merge/universal/Contents/MacOS/$APP_NAME" 2>/dev/null || \
            lipo -info "merge/universal/Contents/MacOS/naxlo_two"
          # Ad-hoc signature: a merged binary is an invalidly signed one, and macOS
          # kills it on launch rather than warning. Real distribution needs a
          # Developer ID + notarization, which this repo cannot do from CI.
          codesign --remove-signature "merge/universal" 2>/dev/null || true
          codesign --force --deep --sign - "merge/universal"
          mkdir -p dmgroot && cp -a "merge/universal" "dmgroot/$APP_NAME"
          ln -s /Applications "dmgroot/Applications"
          hdiutil create -volname "Naxlo Two" -srcfolder dmgroot -ov -format UDZO \
            "dist/Naxlo.macOS.universal.dmg"
          shasum -a 256 "dist/Naxlo.macOS.universal.dmg"
          rm -rf merge

      - uses: actions/upload-artifact@v4
        with:
          name: naxlo-macos-universal
          path: app/dist/Naxlo.macOS.universal.dmg
          if-no-files-found: error

  # Flutter cannot cross-compile Windows ARM64 from an x64 host, so this target
  # needs an ARM64 runner. It is opt-in via workflow_dispatch rather than
  # `continue-on-error`, because a job that is allowed to fail is how an advertised
  # download silently stops existing while the README still links to it.
  build-windows-arm:
    name: windows arm64
    if: ${{ github.event.inputs.include_arm == 'true' && needs.preflight.outputs.skip != 'true' }}
    needs: [preflight, engines]
    runs-on: [windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: engine-windows-amd64
          path: app/assets/engine

      - name: Build + installer
        working-directory: app
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          bash ../scripts/bootstrap_platforms.sh windows
          flutter pub get
          flutter build windows --release
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$env:VERSION /DMyAppArch=arm64 `
            ..\packaging\windows\naxlo-two.iss
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item ..\packaging\windows\installer\Output\setup-Naxlo.arm64.exe dist\
      - uses: actions/upload-artifact@v4
        with:
          name: naxlo-windows-arm64
          path: app/dist/*.exe
          if-no-files-found: error

  build-android:
    if: needs.preflight.outputs.skip != 'true'
    needs: preflight
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter-version }}
          cache: true

      - name: Build
        working-directory: app
        run: |
          bash ../scripts/bootstrap_platforms.sh android
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 \
            || flutter build apk --release

      # Without these two secrets the release ships debug-signed APKs and says so
      # in the notes — a silent fallback to unsigned output is worse.
      - name: Sign (when keys are configured)
        working-directory: app
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "${KEYSTORE:-}" ]]; then
            echo "::notice title=unsigned::ANDROID_KEYSTORE_BASE64 not set; APKs are debug-signed"
            # dist/ is created by the *next* step, so this line — the only thing the
            # no-keys path does, i.e. the path every fork and every user build takes —
            # failed the whole job with "No such file or directory".
            mkdir -p dist
            echo "unsigned" > dist/signing.txt
          else
            echo "$KEYSTORE" | base64 -d > naxlo-release.keystore
            for apk in build/app/outputs/flutter-apk/app-*.apk; do
              [[ -f "$apk" ]] || continue
              zipalign -p -f 4 "$apk" "$apk.aligned" && mv "$apk.aligned" "$apk"
              apksigner sign --ks naxlo-release.keystore --ks-key-alias "$KEY_ALIAS" \
                --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD "$apk"
              apksigner verify --print-certs "$apk" | head -3
            done
            rm -f naxlo-release.keystore
          fi

      - name: Collect
        working-directory: app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Naxlo.apk" 2>/dev/null || true
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-$abi-release.apk"
            [[ -f "$src" ]] && cp "$src" "dist/Naxlo.android.$abi.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: naxlo-android
          path: app/dist/*.apk
          if-no-files-found: error

  publish:
    name: create release + update manifest
    if: always() && !cancelled() && needs.preflight.result == 'success' && needs.preflight.outputs.skip != 'true'
    needs: [preflight, build-linux, build-windows, build-macos-arch, build-macos-universal, build-android]
    # Publish what built, and name what did not. Requiring every platform meant one
    # red runner (a dmg step, a signing hiccup) left the user with no download at
    # all — including the Windows installer that had compiled fine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: "naxlo-*"
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          files=(.*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::no platform job produced an artifact, so there is nothing to publish"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or refresh the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          notes="$(gh api "repos/{owner}/{repo}/releases/tags/$TAG" --jq .body 2>/dev/null || true)"
          if [[ -z "$notes" ]]; then
            notes="$(git log --format='- %s (%h)' --no-merges "$(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~20)"..HEAD 2>/dev/null | head -60)"
          fi
          {
            printf '### Naxlo Two %s\n\n' "$VERSION"
            printf '%s\n\n' "$notes"
            printf 'Engines bundled by this build: see `packaging/` notes. Installers are\n'
            printf 'sha256-summed in `SHA256SUMS.txt`; the in-app updater verifies before installing.\n\n'
            printf '### Install\n\n| Platform | File |\n| --- | --- |\n'
            missing=""
            for f in setup-Naxlo.x64.exe setup-Naxlo.arm64.exe Naxlo.macOS.universal.dmg Naxlo.linux.x64.deb \
                     Naxlo.linux.x64.rpm Naxlo.linux.x64.pkg.tar.zst Naxlo.linux.x64.AppImage Naxlo.apk; do
              if [[ -f "artifacts/$f" ]]; then
                printf '| %s | `%s` |\n' "${f%%.*}" "$f"
              else
                missing+=" $f"
              fi
            done
            if [[ -n "$missing" ]]; then
              printf '\n_Not built in this run (that platform job is red; the rows above are what exists):%s_\n' "$missing"
            fi
          } > body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file body.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "Naxlo Two $VERSION" --notes-file body.md --target "$(git rev-parse HEAD)"
          fi

      # The app's updater reads this file from the repository root, so a release
      # without it is a release nobody's client can find.
      - name: Regenerate the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          bash scripts/gen_release_manifest.sh "$TAG"
          # A link for every platform is the normal case, not a precondition: with a
          # partial release the manifest legitimately has no macos entry, and a client
          # reads a missing link as "nothing offered" rather than a broken checksum.
          # Hard-failing here would throw away the assets that do exist.
          if ! jq -e '.windows.stable.link and .linux.stable.link' release >/dev/null; then
            echo "::warning::some platforms have no download link for $TAG (their job published no asset)"
            jq -c '{win: (.windows.stable | has("link")), mac: (.macos.stable | has("link")), linux: (.linux.stable | has("link")), android: (.android.stable | has("link"))}' release
          fi

      - name: Commit manifest
        run: |
          git config user.name "naxlo-release-bot"
          git config user.email "bot@naxlo.dev"
          git add release
          if git diff --cached --quiet; then
            echo "manifest unchanged"
          else
            git commit -m "chore(release): update manifest for ${{ github.event.inputs.tag || github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi
